# JVM / Gradle — ajustado para máquinas com pouca RAM
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=640m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true

# Kotlin compilado dentro do processo do Gradle (economiza memória)
kotlin.compiler.execution.strategy=in-process

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
