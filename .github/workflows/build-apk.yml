name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gerar keystore de debug para CI (se não houver segredos)
        run: |
          if [ ! -f arena-release.jks ]; then
            keytool -genkeypair -v -keystore arena-release.jks -keyalg RSA \
              -keysize 2048 -validity 10000 -alias arena \
              -storepass ci-password -keypass ci-password \
              -dname "CN=Arena AI CI, O=Personal, C=BR"
            cat > keystore.properties <<EOF
          storeFile=arena-release.jks
          storePassword=ci-password
          keyAlias=arena
          keyPassword=ci-password
          EOF
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaAI-apk
          path: app/build/outputs/apk/release/*.apk
